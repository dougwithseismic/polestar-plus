[package]
name = "polestar-plus"
version = "0.1.0"
edition = "2021"
description = "Reads the Polestar add-on's guide and arrow state out of World of Warcraft: Forever"
license = "GPL-3.0-only"
repository = "https://github.com/dougwithseismic/polestar-plus"
readme = "README.md"

[dependencies]
anyhow = "1"
fontdue = "0.9"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
